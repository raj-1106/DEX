name: test

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  forge-test:
    name: Foundry build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install pinned dependencies
        run: |
          forge install foundry-rs/forge-std@v1.9.7 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.7.0 --no-git
          forge install Uniswap/v4-core@46c6834698c48bc4a463a86d8420f4eb1d7f3b75 --no-git
          forge install Uniswap/v4-periphery@dce236d4e2057422d0791d9a973a58765eb46f65 --no-git

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vv
